<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方松医讯</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(248, 229, 215);
        }
        .content-grid {
            display: grid;
            /*grid-template-columns: repeat(6, minmax(200px, 1fr));*/
            width: 100%;
            height: auto;
            overflow: auto;
            flex-shrink: 0;
        }
        #root {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        .container {
            flex: 1;
            flex-shrink: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        #board {
            position: relative;
            height: 5vh;
            width: 100%;
            flex-shrink: 0;
            background-color: white;
            display: flex;
            overflow: hidden;
        }
        .board-inline {
            height: 100%;
            width: auto;
            min-width: 100%;
            flex-shrink: 0;
            font-size: 2vh;
            color: black;
            display: flex;
            align-items: center;
            /*text-shadow: 0 0 10px orange;*/
            animation: slide 15s linear infinite;
        }
        .tl {
            border-left: 1px solid black;
        }
        .tr {
            border-right: 1px solid black;
        }
        .tt {
            border-top: 1px solid black;
        }
        .tb {
            border-bottom: 1px solid black;
        }
        .fb {
            font-weight: bold;
        }
        .center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .p {
            padding-block: 4px;
        }
        @keyframes slide {
            from {
                transform: translateX(0%);
            }
            to {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>
    <div id="root">
    </div>
    <script src="data.js"></script>
    <script src="index.js"></script>
</body>
</html>
